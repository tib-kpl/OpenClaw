name: Build

on:
  push:
    branches: [master]
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

# Game data shipped with every build (CLAW.REZ from the original game is never included)
env:
  GAME_DATA: ASSETS.ZIP config.xml SAVES.XML clacon.ttf console02.tga

jobs:
  linux:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y cmake libsdl2-dev libsdl2-image-dev libsdl2-mixer-dev libsdl2-ttf-dev libsdl2-gfx-dev

      - name: Build
        run: |
          cmake -S . -B build -DCMAKE_BUILD_TYPE=Release
          cmake --build build -j $(nproc)

      - name: Package
        run: |
          mkdir -p dist/OpenClaw
          cp Build_Release/openclaw dist/OpenClaw/
          for f in $GAME_DATA; do cp "Build_Release/$f" dist/OpenClaw/; done
          printf '#!/bin/sh\ncd "$(dirname "$0")" && exec ./openclaw "$@"\n' > dist/OpenClaw/run.sh
          chmod +x dist/OpenClaw/run.sh dist/OpenClaw/openclaw
          tar -C dist -czf OpenClaw-linux-x86_64.tar.gz OpenClaw

      - uses: actions/upload-artifact@v4
        with:
          name: linux
          path: OpenClaw-linux-x86_64.tar.gz

  windows:
    runs-on: windows-2022
    steps:
      - uses: actions/checkout@v4

      - name: Build
        run: |
          # Static MSVC runtime: no Visual C++ Redistributable needed to run the game
          cmake -S . -B build -G "Visual Studio 17 2022" -A Win32 -DCMAKE_POLICY_DEFAULT_CMP0091=NEW -DCMAKE_MSVC_RUNTIME_LIBRARY=MultiThreaded
          cmake --build build --config Release --parallel

      - name: Package
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force dist/OpenClaw | Out-Null
          Get-ChildItem Build_Release -Recurse -Include openclaw.exe, MidiProc.exe | Copy-Item -Destination dist/OpenClaw/
          Copy-Item Build_Release/*.dll dist/OpenClaw/
          foreach ($f in $env:GAME_DATA.Split(' ')) { Copy-Item "Build_Release/$f" dist/OpenClaw/ }
          Compress-Archive -Path dist/OpenClaw -DestinationPath OpenClaw-windows-x86.zip

      - uses: actions/upload-artifact@v4
        with:
          name: windows
          path: OpenClaw-windows-x86.zip

  android:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Install Android NDK and CMake
        run: yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" "ndk;25.2.9519653" "cmake;3.22.1" > /dev/null

      - name: Fetch SDL2 sources
        run: sh android/fetch-deps.sh

      - name: Decode signing key
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        if: env.ANDROID_KEYSTORE_BASE64 != ''
        run: |
          echo "$ANDROID_KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/release.jks"
          echo "ANDROID_KEYSTORE_FILE=$RUNNER_TEMP/release.jks" >> "$GITHUB_ENV"

      - name: Build APK
        working-directory: android
        env:
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          VERSION_NAME="build-${{ github.run_number }}"
          ./gradlew assembleRelease --no-daemon \
            -PappVersionCode=${{ github.run_number }} -PappVersionName="$VERSION_NAME"
          cp app/build/outputs/apk/release/app-release.apk ../OpenClaw-android.apk

      - uses: actions/upload-artifact@v4
        with:
          name: android
          path: OpenClaw-android.apk

  # Every push to master publishes a new release
  release:
    if: github.event_name == 'push' && github.ref == 'refs/heads/master'
    needs: [linux, windows, android]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          merge-multiple: true

      - uses: softprops/action-gh-release@v2
        with:
          tag_name: build-${{ github.run_number }}
          name: OpenClaw build ${{ github.run_number }}
          target_commitish: ${{ github.sha }}
          make_latest: true
          generate_release_notes: true
          body: |
            **CLAW.REZ from the original Captain Claw game is required and not included.**

            - **Windows**: extract the zip, copy `CLAW.REZ` next to `openclaw.exe` and run it.
            - **Linux**: install SDL2 (`sudo apt install libsdl2-2.0-0 libsdl2-image-2.0-0 libsdl2-mixer-2.0-0 libsdl2-ttf-2.0-0 libsdl2-gfx-1.0-0`), extract, copy `CLAW.REZ` next to `openclaw` and launch `run.sh`.
            - **Android**: install the APK and launch it once, then copy `CLAW.REZ` to `Android/data/com.openclaw.game/files/` (e.g. over USB from a PC) and launch again.
          files: |
            OpenClaw-windows-x86.zip
            OpenClaw-linux-x86_64.tar.gz
            OpenClaw-android.apk
